name: Infrastructure Tests

on:
  push:

jobs:
  opentofu_test:
    name: "Run OpenTofu tests"
    runs-on: ubuntu-latest

    permissions:
      id-token: write      # nécessaire pour OIDC
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v3
        with:
          # On lit le rôle IAM depuis un secret GitHub
          role-to-assume: ${{ secrets.TEST_ROLE_ARN }}
          role-session-name: tests-${{ github.run_number }}-${{ github.actor }}
          aws-region: us-east-2   # même région que dans tes providers

      - uses: opentofu/setup-opentofu@v1

      - name: Tofu Test
        env:
          # utilisé dans les .tf comme var.name
          TF_VAR_name: lambda-sample-${{ github.run_id }}
        working-directory: scripts/tofu/live/lambda-sample
        run: |
          tofu init -backend=false -input=false
          tofu test -verbose

